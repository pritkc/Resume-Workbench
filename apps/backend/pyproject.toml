[project]
name = "rm-backend"
version = "1.0.0"
description = "Resume Matcher Backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.17.1",
    "fastapi==0.128.4",
    "uvicorn==0.40.0",
    "python-multipart==0.0.22",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "psycopg[binary]==3.2.12",
    "pyyaml==6.0.3",
    "rendercv[full]==2.8",
    "sqlalchemy==2.0.44",
    "litellm==1.81.8",
    "markitdown[docx]==0.1.4",
    "pdfminer.six==20260107",
    "playwright==1.58.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "vulture>=2.14",
]

[tool.ruff]
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
# Pyflakes + import hygiene; avoid mass pyupgrade churn in legacy code.
select = ["E4", "E7", "E9", "F"]
ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-v",
]
markers = [
    "unit: pure function tests, no external dependencies",
    "service: service layer tests with mocked LLM",
    "integration: API endpoint tests with httpx AsyncClient",
]
