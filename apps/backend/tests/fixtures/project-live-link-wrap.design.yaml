design:
  theme: harvard
  page:
    size: a4
    top_margin: 0.16in
    bottom_margin: 0.16in
    left_margin: 0.31in
    right_margin: 0.31in
    show_footer: false
    show_top_note: false
  colors:
    body: '#374151'
    name: rgb(0, 0, 0)
    headline: '#374151'
    connections: '#374151'
    section_titles: '#374151'
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 9pt
      name: 16pt
      headline: 9pt
      connections: 9pt
      section_titles: 11pt
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.2cm
    space_below_headline: 0.5cm
    space_below_connections: 0.2cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: false
      separator: ·
      space_between_connections: 0.4cm
  section_titles:
    type: centered_with_centered_partial_line
    line_thickness: 0.6pt
    space_above: 0.3cm
    space_below: 0.1cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.6em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 8cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: ''
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: 'DEGREE_WITH_AREA |  **INSTITUTION** |  SUMMARY

        HIGHLIGHTS'
      degree_column: ''
      date_and_location_column: LOCATION, DATE
    normal_entry:
      main_column: "**NAME** -- **LOCATION** \nHIGHLIGHTS"
      date_and_location_column: SUMMARY
    experience_entry:
      main_column: "**COMPANY** | **POSITION** \nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: LOCATION | DATE
    publication_entry:
      main_column: '**TITLE**

        SUMMARY

        AUTHORS

        URL (JOURNAL)'
      date_and_location_column: DATE
