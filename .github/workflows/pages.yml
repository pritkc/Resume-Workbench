name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-pages-site.mjs"
      - "apps/frontend/public/logo.svg"
      - "apps/frontend/public/showcase/builder.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate static website
        run: node scripts/build-pages-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
